    function reachTargetDistance(world, target, stopDistance) {
      const spawn = world.spawn;
      if (!target || !spawn) return null;
      const step = 0.5;
      const key = (x, z) => `${x.toFixed(2)},${z.toFixed(2)}`;
      const startX = Math.round(spawn.x / step) * step;
      const startZ = Math.round(spawn.z / step) * step;
      const queue = [[startX, startZ]];
      const seen = new Set([key(startX, startZ)]);
      let best = Math.hypot(startX - target.x, startZ - target.z);
      let cursor = 0;
      for (; cursor < queue.length; cursor += 1) {
        const [x, z] = queue[cursor];
        const distance = Math.hypot(x - target.x, z - target.z);
        if (distance < best) best = distance;
        if (best <= stopDistance) return best;
        for (const [dx, dz] of [[step, 0], [-step, 0], [0, step], [0, -step]]) {
          const nextX = x + dx;
          const nextZ = z + dz;
          const id = key(nextX, nextZ);
          if (seen.has(id)) continue;
          seen.add(id);
          if (Math.abs(nextX) > 420 || Math.abs(nextZ) > 420) continue;
          if (!world.isWalkable(nextX, nextZ, 0.36, 0)) continue;
          queue.push([nextX, nextZ]);
        }
      }
      return best;
    }

    // Solid props must block the whole footprint of the model they draw, not
    // just the point a script picked, so sample each rendered object's box.
    function checkModelFootprint(world, meshes, feetY, label, boxFilter = () => true) {
      const box = new THREE.Box3();
      for (const mesh of meshes) {
        if (!boxFilter(mesh)) continue;
        box.setFromObject(mesh);
        if (!Number.isFinite(box.min.x) || box.max.x - box.min.x <= 0) continue;
        const name = mesh.name || mesh.parent?.name || "mesh";
        let free = 0;
        let samples = 0;
        for (let u = 1; u <= 3; u += 1) {
          for (let v = 1; v <= 3; v += 1) {
            const x = box.min.x + ((box.max.x - box.min.x) * u) / 4;
            const z = box.min.z + ((box.max.z - box.min.z) * v) / 4;
            samples += 1;
            if (world.isWalkable(x, z, 0.36, feetY)) free += 1;
          }
        }
        record(free === 0, `${label} · ${name}`, `footprint x ${box.min.x.toFixed(2)}..${box.max.x.toFixed(2)} z ${box.min.z.toFixed(2)}..${box.max.z.toFixed(2)} 有 ${free}/${samples} 个采样点可穿过`);
      }
    }

    // Walking off a tabletop used to end support the moment the capsule began
    // to overhang, so the player sank through the table and slid to the floor.
    // Drive the real controls off the edge and measure what the body does.
    function edgeWalkTest(world, tableMesh, { frames = 150 } = {}) {
      const box = new THREE.Box3().setFromObject(tableMesh);
      const startX = box.min.x + 0.35;
      const startZ = (box.min.z + box.max.z) / 2;
      // The drawn box includes the paper stack lying on the tabletop, so the
      // walking surface comes from the collision query, not from box.max.y.
      const topY = world.getFloorHeight(startX, startZ, box.max.y);
      const controls = new FirstPersonControls({
        camera: world.camera,
        canvas: stubCanvas(),
        isWalkable: world.isWalkable,
        getFloorHeight: world.getFloorHeight,
        resolvePosition: world.resolvePosition,
        spawn: { x: startX, z: startZ, yaw: -Math.PI / 2 },
      });
      controls.relocate({ x: startX, z: startZ, yaw: -Math.PI / 2 });
      controls.bodyY = topY + controls.eyeHeight;
      controls.camera.position.y = controls.bodyY;
      controls.onKeyDown({ code: "KeyW", preventDefault() {} });
      let supportLostDepth = null;
      let belowTopFrames = 0;
      let endX = startX;
      for (let index = 0; index < frames; index += 1) {
        controls.update(1 / 60);
        const feet = controls.bodyY - controls.eyeHeight;
        const x = controls.camera.position.x;
        const inside = x > box.min.x && x < box.max.x;
        if (supportLostDepth === null && controls.groundY < topY + controls.eyeHeight - 0.01) {
          supportLostDepth = inside ? Math.min(box.max.x - x, x - box.min.x) : 0;
        }
        if (feet < topY - 0.02 && inside) belowTopFrames += 1;
        endX = x;
      }
      controls.onKeyUp({ code: "KeyW", preventDefault() {} });
      return { topY, box, supportLostDepth, belowTopFrames, endX, feet: controls.bodyY - controls.eyeHeight };
    }

    // Level 0's headline bug: walking straight at the chair used to pass
    // through it. Drive the real controls and check where the player stops.
    function walkTest(world, { startX, startZ, yaw, frames = 150 }) {
      const controls = new FirstPersonControls({
        camera: world.camera,
        canvas: stubCanvas(),
        isWalkable: world.isWalkable,
        getFloorHeight: world.getFloorHeight,
        resolvePosition: world.resolvePosition,
        spawn: { x: startX, z: startZ, yaw },
      });
      controls.relocate({ x: startX, z: startZ, yaw });
      controls.onKeyDown({ code: "KeyW", preventDefault() {} });
      for (let index = 0; index < frames; index += 1) controls.update(1 / 60);
      controls.onKeyUp({ code: "KeyW", preventDefault() {} });
      return { x: world.camera.position.x, z: world.camera.position.z };
    }

    const levels = Object.keys(PROBES).map(Number).sort((a, b) => a - b);
    for (const level of levels) {
      const world = await createBackroomsScene(level);
      await idle();
      // Nothing renders here, so the scene graph still holds un-built world
      // matrices; the model-footprint checks need them up to date.
      world.scene.updateMatrixWorld(true);
      let levelPassed = 0;
      record(typeof world.getFloorHeight === "function", `L${level} 导出 getFloorHeight`, `实际 ${typeof world.getFloorHeight}`);
      record(typeof world.resolvePosition === "function", `L${level} 导出 resolvePosition`, `实际 ${typeof world.resolvePosition}`);
      for (const [x, z, feetY, expect] of PROBES[level]) {
        const walkable = world.isWalkable(x, z, 0.36, feetY);
        const wanted = expect === "f";
        const ok = record(
          walkable === wanted,
          `L${level} 探针 (${x}, ${z}) feet=${feetY}`,
          `期望${wanted ? "可通行" : "被阻挡"}，实际${walkable ? "可通行" : "被阻挡"}`,
        );
        if (ok) levelPassed += 1;
        // A player who ends up inside a prop must be pushed back out, otherwise
        // new colliders would turn into traps. Points that stay blocked even a
        // full body height up are grid geometry (walls, sealed cells), which the
        // push-out is not responsible for.
        if (!walkable && expect === "b" && typeof world.resolvePosition === "function") {
          const wallBlocked = !world.isWalkable(x, z, 0.36, feetY + 1.2);
          if (!wallBlocked) {
            const resolved = world.resolvePosition(x, z, 0.36, feetY, 1);
            const moved = Math.hypot(resolved.x - x, resolved.z - z);
            const pushed = record(
              moved > 0.01,
              `L${level} 嵌进道具能被推出 (${x}, ${z}) feet=${feetY}`,
              "resolvePosition 没有移动玩家",
            );
            if (pushed) levelPassed += 1;
          }
        }
      }
      if (level === -1) {
        const floorAtPad = world.getFloorHeight?.(14.6, 57, 0);
        record(
          Math.abs(floorAtPad - 0.105) < 1e-6,
          "Hub 出生点站在 10.5cm 地台上",
          `getFloorHeight(±14.6) = ${floorAtPad}`,
        );
        const floorAtHall = world.getFloorHeight?.(0, 112, 0);
        record(floorAtHall === 0, "Hub 中央地板高度为 0", `getFloorHeight(0,112) = ${floorAtHall}`);
      }
      if (level === 9) {
        // The tree line hid the player's head in the crown until the foliage was
        // lifted above standing height, so measure the drawn instance bounds.
        const crowns = world.scene.getObjectByName("level-nine-tree-crowns");
        record(Boolean(crowns?.isInstancedMesh), "L9 找到树冠实例网格", "找不到 level-nine-tree-crowns");
        if (crowns?.isInstancedMesh) {
          const geometryBox = new THREE.Box3().setFromBufferAttribute(crowns.geometry.attributes.position);
          const instanceMatrix = new THREE.Matrix4();
          const box = new THREE.Box3();
          let lowest = Infinity;
          for (let index = 0; index < crowns.count; index += 1) {
            crowns.getMatrixAt(index, instanceMatrix);
            box.copy(geometryBox).applyMatrix4(instanceMatrix).applyMatrix4(crowns.matrixWorld);
            lowest = Math.min(lowest, box.min.y);
          }
          record(
            lowest >= 1.75,
            "L9 每棵树的树冠最低点都在头顶(1.75m)以上",
            `最低 ${lowest.toFixed(3)}m（共 ${crowns.count} 棵）`,
          );
        }
      }
      if (level === 0) {
        const chair = world.scene.getObjectByName("level-zero-manila-chair");
        record(Boolean(chair), "L0 椅子模型存在", "找不到 level-zero-manila-chair");
        if (chair) checkModelFootprint(world, [chair], 0, "L0 椅子整个占地");
        const table = world.scene.getObjectByName("level-zero-room-table-1");
        if (table) checkModelFootprint(world, [table], 0, "L0 房间桌整个占地");
        if (table) {
          const edge = edgeWalkTest(world, table);
          record(
            edge.supportLostDepth !== null && edge.supportLostDepth <= 0.06,
            "L0 走到桌面边缘不会提前失去支撑",
            `失去支撑时身体中心仍在桌面内 ${edge.supportLostDepth?.toFixed(3)}m（旧实现为 0.28m）`,
          );
          record(
            edge.belowTopFrames === 0,
            "L0 桌面边缘不再向下穿模",
            `落到桌面以下且仍在桌面上方的帧数 ${edge.belowTopFrames}（旧实现为 3 帧）`,
          );
          record(
            edge.feet <= 0.001 && edge.endX > edge.box.max.x,
            "L0 走出边缘后正常落到地面并离开桌面",
            `落点 x=${edge.endX.toFixed(2)} 脚高 ${edge.feet.toFixed(3)}`,
          );
        }

        const blockedWalk = walkTest(world, { startX: 80.5, startZ: 60.78, yaw: -Math.PI / 2 });
        record(
          blockedWalk.x <= 82.02 && blockedWalk.x >= 81.6,
          "L0 直冲椅子被挡在座位前",
          `终点 (${blockedWalk.x.toFixed(2)}, ${blockedWalk.z.toFixed(2)})，期望 x ≈ 81.9`,
        );
        const freeWalk = walkTest(world, { startX: 80.5, startZ: 62.2, yaw: -Math.PI / 2 });
        record(
          freeWalk.x >= 82.5,
          "L0 椅子旁边同一段路仍可自由行走",
          `终点 (${freeWalk.x.toFixed(2)}, ${freeWalk.z.toFixed(2)})，期望 x ≥ 82.5`,
        );
      }
      if (level === 1) {
        const groups = world.scene.children.filter((child) => child.name === "level-one-workbench-table");
        record(groups.length === 2, "L1 找到两张工作台", `找到 ${groups.length} 张`);
        for (const group of groups) {
          const tools = [];
          group.traverse((child) => {
            if (!child.isMesh) return;
            const box = new THREE.Box3().setFromObject(child);
            if (box.max.y > 1.02) tools.push(child);
          });
          record(tools.length === 2, `L1 ${group.position.x},${group.position.z} 台面工具数`, `找到 ${tools.length} 个高于台面的工具`);
          checkModelFootprint(world, tools, 0.98, `L1 工作台 ${group.position.x},${group.position.z} 工具占地`);
        }
      }

      const targets = REACH_TARGETS[level] ?? (world.targetPosition
        ? [{ x: world.targetPosition.x, z: world.targetPosition.z, stop: 1.25, label: "关卡目标" }]
        : []);
      for (const target of targets) {
        const distance = reachTargetDistance(world, target, target.stop);
        if (distance === null) continue;
        const ok = record(
          distance <= target.stop + 1e-6,
          `L${level} 出生点仍能走到 ${target.label}`,
          `最近只能到 ${distance.toFixed(2)}m（需要 ≤${target.stop}m）`,
        );
        if (ok) levelPassed += 1;
      }
      say(`L${level}: ${levelPassed} 项通过`);
      world.scene.clear();
      await idle();
    }

    flush();
    if (failures.length === 0) document.title = "PASS 道具实体碰撞验收";
    else document.title = `FAIL ${failures.length}`;
  </script>
</body>
</html>
